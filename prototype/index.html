<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>重走西游 · 寻圣 — 剑仙同行</title>
<link rel="icon" href="assets/hero.svg" type="image/svg+xml" />
<style>
  :root{
    --gold:#d9b877; --gold2:#f2dda8; --golddim:#7d6a45;
    --txt:#e8e1d2; --muted:#9b9587;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0; overflow:hidden; background:#07090b;}
  body{font-family:"Kaiti SC","KaiTi","STKaiti","Songti SC","Noto Serif SC",serif; color:var(--txt); user-select:none;}
  #game{position:fixed; inset:0; display:block; width:100%; height:100%;}

  .hud{position:fixed; inset:0; pointer-events:none; padding:16px 18px; display:flex; flex-direction:column;}
  .hud-row{display:flex; align-items:flex-start; gap:14px;}
  .pane{
    background:linear-gradient(180deg,#0d1216dd,#080b0edd);
    border:1px solid #242c33; border-radius:12px; padding:10px 13px;
    box-shadow:0 10px 30px #0007, inset 0 1px 0 #ffffff0d;
    backdrop-filter:blur(4px);
  }
  .left{width:270px;}
  .mid{margin:0 auto; text-align:center; min-width:272px; padding:10px 16px;}
  .right{margin-left:auto; width:212px; display:flex; flex-direction:column; gap:7px; align-items:flex-end; background:none; border:none; box-shadow:none; padding:0;}

  .hp{position:relative; height:16px; border-radius:99px; background:#000a; overflow:hidden; border:1px solid #3a2a26;}
  .hp i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#7d2b25,#d0604c 70%,#e88a6f); transition:width .18s;}
  .hp b{position:absolute; inset:0; display:grid; place-items:center; font-size:10.5px; letter-spacing:1px; font-weight:500; color:#ffe9df; text-shadow:0 1px 2px #000;}
  .xp{height:6px; border-radius:99px; background:#000a; margin-top:6px; overflow:hidden; border:1px solid #1c2a33;}
  .xp i{display:block; height:100%; width:0; background:linear-gradient(90deg,#2f6f8f,#7fd8ef); transition:width .18s;}
  .meta{display:flex; justify-content:space-between; margin-top:6px; font-size:10.5px; color:var(--muted); letter-spacing:1px;}
  .meta b{color:var(--gold2); font-weight:600;}

  .timer{font-size:26px; letter-spacing:3px; color:var(--gold2); line-height:1;}
  .mid .sub{font-size:10.5px; color:var(--muted); letter-spacing:2px; margin-top:5px;}
  .bossbar{width:100%; height:8px; margin:8px 0 0; border-radius:99px; background:#000a; border:1px solid #4a2b3a; overflow:hidden;}
  .bossbar i{display:block; height:100%; width:100%; background:linear-gradient(90deg,#5a3a8f,#b07fe8); transition:width .15s;}
  .bossbar.hidden{display:none;}

  .icons{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
  .ic{
    width:30px; height:30px; border-radius:8px; position:relative;
    display:grid; place-items:center; font-size:14px; color:var(--c);
    background:radial-gradient(circle at 35% 28%,#1b242c,#0a0e12);
    border:1px solid var(--c); box-shadow:0 0 14px -6px var(--c), inset 0 0 12px #0009;
  }
  .ic em{
    position:absolute; right:-4px; bottom:-4px; font-style:normal; font-size:8px; min-width:13px; height:13px;
    display:grid; place-items:center; border-radius:99px; color:#241a08; font-weight:700;
    background:linear-gradient(180deg,#f2dda8,#c9a55f); border:1px solid #f8ecc8;
  }
  .ic.eq{border-radius:50%; width:26px; height:26px; font-size:12px; box-shadow:0 0 12px -5px var(--c), inset 0 0 10px #0009;}

  .hint{
    margin-top:auto; align-self:center; font-size:11px; letter-spacing:2px; color:#6f6a5e;
    background:#07090baa; padding:6px 14px; border-radius:99px; border:1px solid #1d2329;
  }

  .overlay{
    position:fixed; inset:0; z-index:20; display:grid; place-items:center; padding:20px;
    background:radial-gradient(circle at 50% 42%, #0a0d10e8, #030405fa 80%);
    backdrop-filter:blur(3px); animation:fade .22s ease;
  }
  .overlay.hidden{display:none;}
  body.noanim *{animation:none !important; transition:none !important;}
  @keyframes fade{from{opacity:.65}to{opacity:1}}
  .panel{
    width:100%; max-width:760px; text-align:center; padding:28px 26px 24px; border-radius:18px;
    background:linear-gradient(180deg,#161c22,#0c1014);
    border:1px solid #333a30; box-shadow:0 40px 90px #000c, inset 0 1px 0 #ffffff10;
    animation:rise .3s cubic-bezier(.2,.8,.3,1.1);
  }
  @keyframes rise{from{opacity:.8; transform:translateY(12px) scale(.985);}to{opacity:1; transform:none;}}
  .panel h1{margin:4px 0 4px; font-size:40px; letter-spacing:12px; color:var(--gold2); font-weight:500; text-indent:12px;}
  .panel h2{margin:0 0 4px; font-size:23px; letter-spacing:6px; color:var(--gold2); font-weight:500;}
  .panel .sub{color:var(--gold); letter-spacing:6px; font-size:12.5px; margin:0 0 14px;}
  .panel .desc{color:#b9b2a2; font-size:13px; line-height:1.9; margin:0 auto 20px; max-width:540px;}
  .seal{
    width:52px; height:52px; margin:2px auto 12px; border-radius:8px; display:grid; place-items:center;
    background:linear-gradient(160deg,#a8332c,#7d221d); color:#f6e6c8; font-size:26px;
    box-shadow:0 6px 20px #0009, inset 0 0 0 1px #ffffff2e; transform:rotate(-3deg);
  }
  .btn{
    font-family:inherit; font-size:14px; letter-spacing:3px; padding:12px 32px; border-radius:999px; cursor:pointer;
    color:#241a08; font-weight:700; border:1px solid #f6e8c2;
    background:linear-gradient(180deg,#f2dda8,#c9a55f);
    box-shadow:0 6px 0 #5a4722, 0 16px 30px #0009; transition:.16s;
  }
  .btn:hover{filter:brightness(1.05); transform:translateY(-1px);}
  .btn:active{transform:translateY(3px); box-shadow:0 3px 0 #5a4722;}
  .btn.secondary{background:linear-gradient(180deg,#1c2229,#12161a); color:#f2dda8; border-color:#5a4f3a; box-shadow:none; font-weight:500;}
  .btn.secondary:hover{border-color:var(--gold);}
  .linkbtn{font-family:inherit; background:none; border:none; color:#8f8a7d; font-size:12px; letter-spacing:2px; cursor:pointer; padding:8px 6px;}
  .linkbtn:hover{color:var(--gold);}
  .hintline{color:#6f6a5e; font-size:11px; letter-spacing:1px; margin-top:14px;}

  .choices{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin:20px 0 8px;}
  .upcard{
    width:184px; min-height:238px; padding:16px 14px 12px; border-radius:12px; cursor:pointer; text-align:left;
    background:linear-gradient(168deg,#f7efdd,#ece0c4 55%,#dccaa6);
    color:#2b2317; border:1.5px solid var(--c);
    box-shadow:0 6px 0 #00000055, 0 16px 30px #00000088;
    transition:transform .16s cubic-bezier(.2,.9,.3,1.35), box-shadow .16s;
    position:relative; display:flex; flex-direction:column;
  }
  .upcard:hover{transform:translateY(-8px) scale(1.03); box-shadow:0 10px 0 #00000055, 0 26px 44px #000a, 0 0 30px -6px var(--c);}
  .upcard::before{content:""; position:absolute; left:0; right:0; top:0; height:3px; border-radius:12px 12px 0 0; background:var(--c); opacity:.85;}
  .upcard .tag{font-size:9.5px; letter-spacing:2px; color:#7a6746; border-bottom:1px solid #00000015; padding-bottom:5px; margin-bottom:8px;}
  .upcard .glyph{font-size:34px; color:var(--c); filter:brightness(.62) saturate(1.35); line-height:1; margin:2px 0 6px;}
  .upcard .uname{font-size:16px; font-weight:700; letter-spacing:1px;}
  .upcard .udesc{font-size:11px; line-height:1.55; color:#4a3c26; margin-top:7px; flex:1;}
  .upcard .ulvl{font-size:10px; letter-spacing:2px; color:#8a6a20; margin-top:8px;}

  .reward{display:flex; align-items:center; gap:18px; text-align:left; margin:20px auto; max-width:420px;
    background:#0d1216; border:1px solid #3a3326; border-radius:14px; padding:16px 18px;}
  .reward .cicon{width:64px; height:64px; border-radius:50%; display:grid; place-items:center; font-size:30px;
    color:var(--c); border:1px solid var(--c); background:radial-gradient(circle at 35% 30%,#1c252d,#080b0e);
    box-shadow:0 0 26px -6px var(--c); flex:none;}
  .reward .cname{font-size:18px; color:var(--gold2); letter-spacing:2px;}
  .reward .cdesc{font-size:11.5px; color:#a9a293; margin-top:5px; line-height:1.5;}

  .statline{display:flex; justify-content:center; gap:26px; color:#9b9587; font-size:12px; letter-spacing:1px; margin:8px 0 18px;}
  .statline b{color:var(--gold2); font-weight:500;}

  @media (max-width:760px){
    .hud{padding:10px;}
    .pane.left{width:168px; padding:8px 10px;}
    .pane.mid{min-width:120px; padding:6px 9px;}
    .timer{font-size:18px;}
    .right{width:122px; gap:5px;}
    .ic{width:24px; height:24px; font-size:12px;}
    .ic em{font-size:7px; min-width:11px; height:11px;}
    .ic.eq{width:22px; height:22px; font-size:11px;}
    .hint{font-size:10px;}
    .panel h1{font-size:28px; letter-spacing:8px;}
    .upcard{width:148px; min-height:200px; padding:12px 11px 10px;}
    .upcard .uname{font-size:14px;}
    .upcard .udesc{font-size:10px;}
  }
</style>
<link rel="stylesheet" href="cinematic.css" />
<link rel="stylesheet" href="journey.css" />
<link rel="stylesheet" href="sound.css" />
<link rel="stylesheet" href="character.css" />
</head>
<body>
<canvas id="game"></canvas>
<div class="window-controls"><button id="characterBtn" title="C 人物状态">人物 C</button><button id="mapBtn" aria-label="展开或关闭地图">舆图 Tab</button><button id="journalBtn">寻圣残卷</button><button id="audioBtn" aria-controls="audioPanel" aria-expanded="false">♫ 声音</button><button id="fullscreenBtn" title="F 切换全屏">⛶ 全屏 <kbd>F</kbd></button><a href="./index.html" target="_blank" rel="noopener" title="在独立窗口游玩">↗ 独立窗口</a><span id="screenNotice" role="status"></span></div>
<aside id="audioPanel" class="sound-panel" hidden aria-label="声音设置">
  <div class="sound-heading"><strong>声入西行</strong><button id="closeAudioBtn" aria-label="关闭声音设置">×</button></div>
  <p id="audioStatus" role="status">点击入劫后启用声音 · M 静音</p>
  <label for="musicVolume">背景音乐 <output id="musicVolumeValue">42%</output></label><input id="musicVolume" type="range" min="0" max="100" value="42" />
  <label for="effectsVolume">招式音效 <output id="effectsVolumeValue">65%</output></label><input id="effectsVolume" type="range" min="0" max="100" value="65" />
  <label for="voiceVolume">法术配音 <output id="voiceVolumeValue">85%</output></label><input id="voiceVolume" type="range" min="0" max="100" value="85" />
  <div class="sound-buttons"><button id="previewVoiceBtn">试听招式</button><button id="muteAudioBtn" aria-pressed="false">静音全部声音</button></div>
  <small>配音时音乐自动降低 · M 快速静音</small>
</aside>

<div class="hud">
  <div class="hud-row">
    <div class="pane left">
      <div class="identity"><span class="portrait" id="heroGlyph">果</span><div><strong id="heroName">孙小果</strong><small id="identitySub">无籍剑仙 · 循毫寻圣</small></div><span class="realm">剑修</span></div>
      <div class="hp"><i id="hpFill"></i><b id="hpText">100 / 100</b></div>
      <div class="xp"><i id="xpFill"></i></div>
      <div class="meta"><span>等级 Lv.<b id="lvl">1</b></span><span id="shieldTxt">护盾 0</span></div>
      <div class="cultivation-hud"><span id="cultivationLabel">筑基·初期</span><span id="cultivationQi">突破修为 0 / 320</span><small id="saveStatus" role="status">自动存档待启用</small></div>
    </div>
    <div class="pane mid">
      <div class="chapter" id="chapterTitle">壹 · 金蝉遭贬</div>
      <div class="timer" id="timer">00:00</div>
      <div class="sub" id="kills">斩妖 0</div>
      <div class="bossbar hidden" id="bossWrap"><i id="bossFill"></i></div>
      <div id="bossHealth" class="boss-health"></div>
      <div id="bossWeakness" class="boss-weakness" hidden></div>
    </div>
    <div class="pane right">
      <div class="icons" id="spells"></div>
      <div class="icons" id="equips"></div>
    </div>
  </div>
  <div class="objective"><span class="eyebrow">本关目标</span><strong id="objectiveText">循金毫入劫，击败缄口监院</strong><span id="objectiveDetail">击杀守关首领才可通关 · 生命归零则失败</span><span id="scalingStatus" class="encounter-status"></span><span id="encounterStatus" class="encounter-status"></span><div id="pickupNotice" class="pickup-notice" role="status" aria-live="polite" hidden></div></div>
  <div class="bottom-hud">
    <div class="location"><span id="locationTitle">旧灵山 · 贬谪禅庭</span><small id="locationSubtitle">无籍剑仙 · 循毫寻圣</small></div>
    <div class="hint"><kbd>W A S D</kbd> 移动 <kbd>空格</kbd> 闪避 <kbd>Q</kbd> 大招 <kbd>E</kbd> 交互 <kbd>Tab</kbd> 舆图</div>
    <button id="interactBtn" class="interact-btn" hidden>E 交互</button><div class="actions"><button id="dashBtn" class="action" aria-label="闪避"><span>闪</span><small id="dashStatus">空格 · 闪避</small></button><button id="ultimateBtn" class="action ultimate" aria-label="释放大招：天剑归一"><span>天剑</span><small id="ultStatus">Q · 大招就绪</small><i id="ultFill"></i></button></div>
  </div>
</div>

<div class="overlay hidden" id="overlay"></div>

<script src="chapters.js"></script>
<script src="chapters-content.js"></script>
<script src="infant.js"></script>
<script src="infant-uv.js"></script>

<script src="spell-combat.js"></script>
<script src="items.js"></script>

<script src="progress.js"></script>

<script src="journey.js"></script>
<script src="bosses.js"></script>
<script src="world-nav.js"></script>
<script src="world.js"></script>
<script src="director.js"></script>
<script src="motion.js"></script>
<script src="run-save.js"></script>
<script src="character.js"></script>
<script src="game.js"></script>
<aside id="cultivationNotice" class="cultivation-notice" role="status" aria-live="polite" hidden><canvas id="cultivationNoticeArt" width="110" height="130" aria-hidden="true"></canvas><div><strong id="cultivationNoticeTitle"></strong><span id="cultivationNoticeDetail"></span></div></aside>
</body>
</html>
