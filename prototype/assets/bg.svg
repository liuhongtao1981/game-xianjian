<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070F16"/>
      <stop offset=".45" stop-color="#0F222C"/>
      <stop offset=".8" stop-color="#1A3942"/>
      <stop offset="1" stop-color="#20464C"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#F2EAD2" stop-opacity=".38"/>
      <stop offset=".55" stop-color="#CFE0DA" stop-opacity=".12"/>
      <stop offset="1" stop-color="#CFE0DA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCEAE6" stop-opacity="0"/>
      <stop offset=".5" stop-color="#DCEAE6" stop-opacity=".16"/>
      <stop offset="1" stop-color="#DCEAE6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16323B"/>
      <stop offset=".6" stop-color="#0C2028"/>
      <stop offset="1" stop-color="#061118"/>
    </linearGradient>
    <radialGradient id="vign" cx=".5" cy=".45" r=".72">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 星 -->
  <g fill="#E9E4D2">
    <circle cx="210" cy="110" r="2" opacity=".7"/><circle cx="360" cy="70" r="1.6" opacity=".5"/>
    <circle cx="540" cy="150" r="1.8" opacity=".6"/><circle cx="760" cy="90" r="2.2" opacity=".7"/>
    <circle cx="980" cy="130" r="1.6" opacity=".5"/><circle cx="1420" cy="150" r="2" opacity=".6"/>
    <circle cx="1260" cy="70" r="1.8" opacity=".55"/><circle cx="640" cy="220" r="1.4" opacity=".45"/>
  </g>

  <!-- 月 -->
  <circle cx="1180" cy="230" r="240" fill="url(#moonGlow)"/>
  <circle cx="1180" cy="230" r="86" fill="#EDE6D2" opacity=".92"/>
  <circle cx="1158" cy="212" r="12" fill="#DCD3BB" opacity=".55"/>
  <circle cx="1204" cy="252" r="16" fill="#DCD3BB" opacity=".4"/>
  <circle cx="1188" cy="196" r="7" fill="#DCD3BB" opacity=".4"/>

  <!-- 远山（淡墨） -->
  <path d="M0 540 L120 440 L230 505 L360 395 L470 490 L590 415 L700 500 L830 405 L950 495 L1080 410 L1200 495 L1320 425 L1450 505 L1600 435 L1600 900 L0 900 Z"
        fill="#1B3742" opacity=".55"/>
  <path d="M0 580 L150 480 L280 555 L420 465 L540 550 L680 480 L800 560 L940 475 L1080 555 L1220 485 L1360 565 L1500 505 L1600 560 L1600 900 L0 900 Z"
        fill="#17303A" opacity=".75"/>

  <!-- 中景山（带皴） -->
  <path d="M-40 660 L110 545 L240 620 L390 500 L520 605 L650 535 L790 640 L930 545 L1070 630 L1210 550 L1350 640 L1490 570 L1640 650 L1640 900 L-40 900 Z"
        fill="#122B34" stroke="#0A1A20" stroke-width="4"/>
  <g stroke="#0A1D24" stroke-width="2" opacity=".18" fill="none" stroke-linecap="round">
    <path d="M150 585 q30 40 20 90"/><path d="M180 600 q26 36 18 80"/><path d="M210 620 q22 30 16 66"/>
    <path d="M420 545 q34 44 22 96"/><path d="M452 560 q28 40 18 84"/><path d="M482 585 q24 32 16 70"/>
    <path d="M680 580 q30 40 20 86"/><path d="M712 596 q26 34 16 76"/>
    <path d="M980 590 q32 42 22 90"/><path d="M1012 606 q26 36 16 78"/>
    <path d="M1270 600 q30 40 20 84"/><path d="M1302 616 q24 34 14 72"/>
  </g>

  <!-- 水岸 -->
  <path d="M0 660 L1600 660 L1600 900 L0 900 Z" fill="url(#water)"/>

  <!-- 月影 -->
  <g opacity=".3" fill="#EDE6D2">
    <ellipse cx="1180" cy="705" rx="66" ry="8"/>
    <ellipse cx="1180" cy="730" rx="42" ry="6"/>
    <ellipse cx="1180" cy="750" rx="26" ry="4"/>
  </g>

  <!-- 水纹 -->
  <g stroke="#9FC4CF" stroke-width="3" fill="none" opacity=".14" stroke-linecap="round">
    <path d="M120 710 q60 -10 120 0 t120 0"/>
    <path d="M760 745 q70 -12 140 0 t140 0"/>
    <path d="M300 800 q80 -14 160 0 t160 0"/>
    <path d="M1060 835 q60 -10 120 0 t120 0"/>
  </g>

  <!-- 亭台（左崖） -->
  <g>
    <path d="M150 660 L250 610 L370 660 Z" fill="#0F252C" stroke="#08161B" stroke-width="3"/>
    <g fill="#0D2026" stroke="#071318" stroke-width="3">
      <rect x="238" y="556" width="64" height="26" rx="4"/>
      <rect x="248" y="528" width="44" height="28" rx="4"/>
      <path d="M220 556 q50 -24 100 0 Z"/>
      <path d="M232 528 q38 -20 76 0 Z"/>
      <rect x="262" y="548" width="10" height="12" fill="#E0A85C" stroke="none" opacity=".85"/>
    </g>
    <line x1="330" y1="600" x2="330" y2="636" stroke="#071318" stroke-width="3"/>
    <ellipse cx="330" cy="646" rx="9" ry="12" fill="#C8503F"/>
    <ellipse cx="330" cy="646" rx="22" ry="26" fill="#C8503F" opacity=".14"/>
  </g>

  <!-- 松树（前景剪影） -->
  <g fill="#0A1B21" stroke="#061217" stroke-width="3">
    <path d="M60 900 q10 -120 26 -180 q-40 -20 -60 -6 q34 -26 66 -14 q-6 -44 -34 -64 q40 6 52 46 q16 -40 46 -56 q-18 34 -22 74 q28 -10 50 8 q-32 4 -48 22 q12 30 8 70 q-22 -38 -26 -70 q-16 46 -16 110 Z"/>
    <path d="M1500 900 q-8 -100 -22 -160 q30 -24 56 -12 q-26 -20 -52 -12 q4 -36 28 -54 q-34 6 -44 40 q-14 -34 -40 -48 q16 30 18 62 q-24 -8 -42 8 q26 4 40 20 q-10 26 -6 60 q18 -32 22 -58 q12 40 12 94 Z"/>
  </g>

  <!-- 雾带 -->
  <rect x="0" y="380" width="1600" height="90" fill="url(#mist)"/>
  <rect x="0" y="520" width="1600" height="110" fill="url(#mist)" opacity=".8"/>
  <rect x="0" y="640" width="1600" height="90" fill="url(#mist)" opacity=".6"/>

  <!-- 花瓣 -->
  <g fill="#F2A0B8" opacity=".75">
    <ellipse cx="460" cy="330" rx="7" ry="4" transform="rotate(24 460 330)"/>
    <ellipse cx="620" cy="440" rx="6" ry="3.5" transform="rotate(-18 620 440)"/>
    <ellipse cx="960" cy="380" rx="7" ry="4" transform="rotate(40 960 380)"/>
    <ellipse cx="1320" cy="540" rx="8" ry="4.5" transform="rotate(-30 1320 540)"/>
    <ellipse cx="760" cy="600" rx="6" ry="3.5" transform="rotate(12 760 600)"/>
  </g>

  <rect width="1600" height="900" fill="url(#vign)"/>
</svg>
