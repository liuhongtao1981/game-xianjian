name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'prototype/**'
      - 'tools/check-syntax.js'
      - 'tools/check-director.js'
      - 'tools/check-boss-summons.js'
      - 'tools/check-carryover.js'
      - 'tools/check-saves.js'
      - 'tools/check-cultivation.js'
      - 'tools/check-auto-cultivation.js'
      - 'tools/check-realm-passage.js'
      - 'tools/check-expansion.js'
      - 'tools/check-infant.js'
      - 'tools/check-huashen.js'
      - 'tools/check-lianxu.js'
      - 'tools/check-heti.js'
      - 'tools/check-reward-cards.js'
      - 'tools/check-ascension-scene.js'
      - 'tools/check-spell-growth.js'
      - 'tools/check-spell-priority.js'
      - 'tools/check-thunder.js'
      - 'tools/check-experience.js'
      - 'tools/check-realm-upgrades.js'
      - 'tools/check-gift-overflow.js'
      - 'tools/check-realm-loot.js'
      - 'tools/check-story-audio.js'
      - 'tools/check-heavy-voices.js'
      - 'tools/check-runtime-cache-ui.js'
      - 'tools/check-world.js'
      - 'tools/check-heroes.js'
      - 'tools/check-pressure.js'
      - 'tools/check-actor-motion.js'
      - 'tools/check-bosses.js'
      - 'tools/check-continuous-boss.js'
      - 'tools/check-ultimate-arts.js'
      - 'tools/check-encounters.js'
      - 'tools/game-harness.js'
      - 'tools/build-pages.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check game scripts
        run: |
          node tools/check-syntax.js
          node tools/check-director.js
          node tools/check-boss-summons.js
          node tools/check-carryover.js
          node tools/check-saves.js
          node tools/check-cultivation.js
          node tools/check-auto-cultivation.js
          node tools/check-realm-passage.js
          node tools/check-expansion.js
          node tools/check-infant.js
          node tools/check-huashen.js
          node tools/check-lianxu.js
          node tools/check-heti.js
          node tools/check-spell-growth.js
          node tools/check-spell-priority.js
          node tools/check-thunder.js
          node tools/check-experience.js
          node tools/check-pickups.js
          node tools/check-reward-cards.js
          node tools/check-ascension-scene.js
          node tools/check-combat.js
          node tools/check-world.js
          node tools/check-realm-upgrades.js
          node tools/check-gift-overflow.js
          node tools/check-realm-loot.js
          node tools/check-story-audio.js
          node tools/check-heavy-voices.js
          node tools/check-heroes.js
          node tools/check-pressure.js
          node tools/check-actor-motion.js
          node tools/check-bosses.js
          node tools/check-continuous-boss.js
          node tools/check-ultimate-arts.js
          node tools/check-encounters.js
      - name: Package playable game
        run: node tools/build-pages.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
